<h3 id="reading-the-map">Reading the map</h3>
<h1 id="reading-the-value-chain">Reading the value chain</h1>
<ul>
<li>Upper components are visible to the user. Lower components are hidden from the user</li>
<li>Read down to ask how: how is this need met?</li>
<li>Read up to ask why: why do we need this?</li>
<li>Each link is a dependency and an exchange: the component above pays money or effort, and gets a capability back</li>
<li>So every component has a cost, and provides value to the one above it</li>
<li>A map is a chain of <mark>needs</mark></li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="reading-the-map-1">Reading the map</h3>
<h1 id="what-goes-on-a-map">What goes on a map</h1>
<ul>
<li>Activities: what we do. Making a cup of tea</li>
<li>Practices: how we do it. Hand brewing</li>
<li>Data: facts we keep. The menu and the prices</li>
<li>Knowledge: what we understand. How strong tea should be</li>
<li>Things we use: the cup, the kettle</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="divider" data-theme="galaxitech-black-grey-sand" lang="en-US" class="divider" style="--footer:GalaxiTech · DDD Belgium workshop 2026;--class:divider;--theme:galaxitech-black-grey-sand;">
<h6 id="012">01.2</h6>
<h2 id="the-canvas-six-steps-to-a-map">The canvas: six steps to a map</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="map exercise inset" data-theme="galaxitech-black-grey-sand" lang="en-US" class="map exercise inset" data-marpit-pagination="19" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:map exercise inset;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="mapping--the-wardley-mapping-canvas-by-ben-mosior">Mapping · the Wardley Mapping Canvas, by Ben Mosior</h3>
<p><img src="assets/wardley-mapping-canvas.webp" alt="The Wardley Mapping Canvas by Ben Mosior, CC BY-SA 4.0: six boxes, 1 purpose, 2 scope, 3 users, 4 user needs, 5 value chain with a visibility axis, 6 map with the evolution axis from genesis to commodity and the evolutionary characteristics of each stage" /></p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="20" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="mapping--the-canvas-step-by-step">Mapping · the canvas, step by step</h3>
<h1 id="six-steps-to-a-wardley-map">Six steps to a Wardley map</h1>
<ul>
<li>1 Purpose: why are we mapping? (exercise 1)</li>
<li>2 Scope: what is in, what is out? (exercise 1)</li>
<li>3 Users: who is it for? (exercise 1)</li>
<li>4 User needs: what do they need? (exercise 1)</li>
<li>5 Value chain: what do the needs depend on? (exercise 2)</li>
<li>6 Map: place it all on the evolution axis (exercise 3)</li>
<li>Tonight we do steps 1-6 across exercises 1, 2, and 3</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="divider" data-theme="galaxitech-black-grey-sand" lang="en-US" class="divider" style="--footer:GalaxiTech · DDD Belgium workshop 2026;--class:divider;--theme:galaxitech-black-grey-sand;">
<h6 id="013">01.3</h6>
<h2 id="tonights-case-harbour-insurance">Tonight's case: Harbour Insurance</h2>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="22" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="the-exercises--one-scenario-all-evening">The exercises · one scenario all evening</h3>
<h1 id="exercise-1-harbour-insurance">Exercise 1: Harbour Insurance</h1>
<ul>
<li>Imagine you are a product team at Harbour Insurance, a fictional company</li>
<li>Every team now has AI coding agents. Code arrives in hours, not days</li>
<li>Yet customers get new features no faster than before</li>
<li>Management asks: we pay for AI coding agents, but we don't see faster delivery. <mark>What is happening?</mark></li>
<li>Your domain expert knows more about the company. Ask them</li>
<li>Your task: identify the users of the delivery system and their needs (canvas steps 1-4)</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="23" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="the-exercises--the-company">The exercises · the company</h3>
<h1 id="exercise-1-the-company-and-its-purpose">Exercise 1: the company and its purpose</h1>
<ul>
<li>Harbour Insurance insures ships, cargo and the businesses around the port of Antwerp</li>
<li>About 2,000 employees and 300,000 policies. Quotes, policies and claims all run through its own software</li>
<li>The product and engineering organisation: 6 product teams, about 40 developers, one architect</li>
<li>Its purpose: get new insurance products and changes to customers quickly and safely</li>
<li>Its scope for today: from a product hypothesis to customers using the change</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="24" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="the-exercises--what-we-map">The exercises · what we map</h3>
<h1 id="exercise-1-what-do-we-map">Exercise 1: what do we map?</h1>
<table>
<thead>
<tr>
<th></th>
<th>The marketplace</th>
<th>An internal value chain</th>
</tr>
</thead>
<tbody>
<tr>
<td>What it is</td>
<td>The company, its customers and its competitors</td>
<td>One part of the company, mapped on its own</td>
</tr>
<tr>
<td>Its users</td>
<td>Ship owners, brokers, port businesses</td>
<td>Management, product, architect, developers, QA</td>
</tr>
<tr>
<td>A typical need</td>
<td>A fair quote, quickly</td>
<td>Time to market, fast feedback</td>
</tr>
</tbody>
</table>
<p>Most maps start from the marketplace. Tonight we map an internal value chain: <mark>how Harbour Insurance delivers change</mark>. The customer is still at the end of it.</p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="25" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="your-group">Your group</h3>
<h1 id="exercise-1-four-people-four-roles">Exercise 1: four people, four roles</h1>
<ul>
<li>Domain expert: has the final word and decides</li>
<li>Facilitator: starts the talk, makes sure all are heard</li>
<li>Timekeeper: keeps time and keeps you moving</li>
<li>Clerk: materials, the canvas, runs to CJ with questions</li>
<li>Feel free to swap roles after each exercise</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="26" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="your-group--how-you-work">Your group · how you work</h3>
<h1 id="exercise-1-one-two-four">Exercise 1: one, two, four</h1>
<ul>
<li>First, think on your own for a moment</li>
<li>Then share in pairs, two and two</li>
<li>Then share in your group of four</li>
<li>The clerk writes down your questions and your decisions</li>
<li>Work this way in every exercise</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="27" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-1--group-work">Exercise 1 · group work</h3>
<h1 id="exercise-1-who-needs-what">Exercise 1: who needs what?</h1>
<ul>
<li>Follow the canvas, steps 1 to 4</li>
<li>Write the purpose and the scope first</li>
<li>Then identify the users of the delivery system</li>
<li>Under each user, write their needs on stickies</li>
<li><strong>Stop here</strong> - value chain comes in Exercise 2</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="28" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-1--back-together">Exercise 1 · back together</h3>
<h1 id="exercise-1-discuss-your-findings">Exercise 1: discuss your findings</h1>
<ul>
<li>How many different users did you identify?</li>
<li>Which user has the most needs? The fewest?</li>
<li>Are any needs shared across multiple users?</li>
<li>Next: we'll pick ONE anchor to build our map from</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="map exercise inset" data-theme="galaxitech-black-grey-sand" lang="en-US" class="map exercise inset" data-marpit-pagination="29" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:map exercise inset;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-1--one-example">Exercise 1 · one example</h3>
<p><img src="assets/exercise-1-miro-canvas-16x9.png" alt="One way to do exercise 1: five users identified (management person, product person, software architect, developer, QA person) with their needs on green sticky notes. No value chain, no map yet - just discovery" /></p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="30" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="before-exercise-2--facilitation">Before Exercise 2 · facilitation</h3>
<h1 id="pick-your-anchor">Pick your anchor</h1>
<ul>
<li>You've identified multiple users - great!</li>
<li>To build <strong>one map</strong>, we need <strong>one anchor</strong></li>
<li>Ask: <strong>what question is this map answering?</strong></li>
<li>For Harbour Insurance: &quot;Why is delivery slow?&quot;</li>
<li>Pick the user whose need matters for that question</li>
<li>Suggestion: Management + &quot;Time to market&quot;</li>
<li>The other needs become <strong>components</strong> in your chain</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="31" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-2--group-work">Exercise 2 · group work</h3>
<h1 id="exercise-2-build-the-chain">Exercise 2: build the chain</h1>
<ul>
<li>Start from your chosen anchor (e.g., Management + Time to market)</li>
<li>Build the value chain: what does that need depend on?</li>
<li>Keep asking &quot;what does X depend on?&quot; until you reach infrastructure</li>
<li>Stack components by visibility: visible to users at top, hidden at bottom</li>
<li><strong>No evolution axis yet</strong> - that comes in Exercise 3</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="32" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-2--back-together">Exercise 2 · back together</h3>
<h1 id="exercise-2-discuss-your-chain">Exercise 2: discuss your chain</h1>
<ul>
<li>Where is the line between problem domain and solution domain?</li>
<li>Which dependency was hardest to identify?</li>
<li>Did you reach infrastructure, or stop somewhere in the middle?</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="map exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="map exercise" data-marpit-pagination="33" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:map exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-2--one-way-to-map-it">Exercise 2 · one way to map it</h3>
<p><img src="assets/diagrams/wardley-agentic-ex2-chain.svg" alt="One way to map exercise 2. There is one anchor, Management, and its need is time to market. Below it, the value chain is laid out as a tree by visibility, with no evolution axis yet: product hypothesis, code changes, code review, release pipeline, the AI coding agent, specification, reviewers, continuous integration, domain knowledge and compute." /></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="climate--co-evolution">Climate · co-evolution</h3>
<h1 id="practices-evolve-with-the-activity">Practices evolve with the activity</h1>
<ul>
<li>Servers as a product: you need capacity planning</li>
<li>Compute as a utility: autoscaling replaces it</li>
<li>Some teams still plan capacity by hand. That is inertia</li>
<li>Review is old: punch cards made mistakes costly</li>
<li>Open source made review a daily practice</li>
<li>Code is now a commodity. <mark>Review will evolve too</mark></li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="56" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">

<h3 id="scoping--after-tristan-slominski">Scoping · after Tristan Slominski</h3>
<h1 id="how-much-should-we-map">How much should we map?</h1>
<ul>
<li>Maps grow until they stop saying anything</li>
<li>Ask: what is the primary constraint here?</li>
<li>Map the user, the need, the path to it</li>
<li>Map around the constraint, as Tristan Slominski teaches it</li>
</ul>

<p><img src="assets/diagrams/wardley-tea-toc-reveal-07.svg" alt="Hand brewing could evolve toward batch brewing with a tea urn, but staff want to brew every cup by hand: the inertia sits on that line" /></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="tea-shop-at-rush-hour-1">Tea shop at rush hour</h3>
<h1 id="two-kinds-of-friction">Two kinds of friction</h1>
<ul>
<li>Constraint: a capacity limit. One kettle, a queue</li>
<li>Inertia: resistance to change. &quot;We brew by hand&quot;</li>
<li>A constraint caps the flow; inertia blocks the move</li>
<li>Work on the constraint first. The rest waits on it</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="theory-of-constraints--goldratt">Theory of Constraints · Goldratt</h3>
<h1 id="goldratt-exploit-before-you-elevate">Goldratt: exploit before you elevate</h1>
<ul>
<li>First ask: is the constraint outside the shop or inside?</li>
<li>Exploit: get the most out of the constraint as it is</li>
<li>Subordinate: pace everything else to it</li>
<li>Elevate: invest only when that is not enough</li>
<li>Repeat: the constraint moves, often into a practice</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="divider" data-theme="galaxitech-black-grey-sand" lang="en-US" class="divider" style="--footer:GalaxiTech · DDD Belgium workshop 2026;--class:divider;--theme:galaxitech-black-grey-sand;">
<h6 id="032">03.2</h6>
<h2 id="pipelines-several-ways-to-do-one-thing">Pipelines: several ways to do one thing</h2>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="pipelines--in-simon-wardleys-sense">Pipelines · in Simon Wardley's sense</h3>
<h1 id="a-pipeline-several-ways-to-do-one-thing">A pipeline: several ways to do one thing</h1>
<ul>
<li>One component, several ways to do it, side by side in a box</li>
<li>Each way sits at its own stage of evolution</li>
<li>A new invention starts on the left</li>
<li>The industrialised form of an old activity goes on the right, however new it is</li>
<li>If people move from one way to another, draw an arrow</li>
<li>Not a delivery pipeline: build, test and release are steps, not ways</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="map" data-theme="galaxitech-black-grey-sand" lang="en-US" class="map" data-marpit-pagination="72" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:map;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="pipelines--after-simon-wardley-map-evolution-not-maturity">Pipelines · after Simon Wardley, &quot;Map evolution not maturity&quot;</h3>
<p><img src="assets/diagrams/pipeline-wardley-compute.svg" alt="Compute as a pipeline, redrawn after Simon Wardley's map for an application builder in 2006: a user needs an application, which needs architectural practice, which needs compute. Compute is a pipeline of server and cloud. Cloud is newer but sits to the right, because it is compute as a utility; a red arrow shows people moving from server to cloud" /></p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="map" data-theme="galaxitech-black-grey-sand" lang="en-US" class="map" data-marpit-pagination="73" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:map;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="legend">Legend</h3>
<p><img src="assets/diagrams/legend.svg" alt="The marks used on these maps: person for the user, gold ring for a user need, striped bar for the bottleneck, solid bar for resists change, gold dashed arrow to a ghost ring for market evolution, block arrows for we push it right and we hold it back, double ring for a component with its own map" /></p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="74" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-4a--group-work">Exercise 4A · group work</h3>
<h1 id="exercise-4a-find-the-constraint">Exercise 4A: find the constraint</h1>
<ul>
<li>Keep working on your map</li>
<li>Mark the constraint: where does work wait longest?</li>
<li>Mark one inertia: what resists change?</li>
<li>Exploit the constraint first: what can you do with no budget?</li>
<li>Subordinate: make the rest of the work serve the constraint</li>
<li>Then elevate it: what would you invest in?</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="75" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-4b--group-work">Exercise 4B · group work</h3>
<h1 id="exercise-4b-draw-three-pipelines">Exercise 4B: draw three pipelines</h1>
<ul>
<li>A pipeline in Wardley's sense: one component, done several ways</li>
<li>Writing code: by hand, with an AI assistant, by AI agents</li>
<li>Checking quality: human review, pairing, automated checks</li>
<li>Releasing: change board, scripted deploy, continuous deployment</li>
<li>Place each way at its own stage of evolution, in one box</li>
<li>Which pipeline moved right? Which one holds the constraint?</li>
</ul>

<li>Is your constraint a practice or a technology?</li>
<li>Which of your exploit moves needs no budget?</li>
<li>Where does the constraint move after you elevate it?</li>
<li>Which way does your team use today, in each pipeline?</li>

<p><img src="assets/warrior-statue-makaryan.webp" alt="A carved wooden guardian warrior statue in a dark temple hall, black and white, lit from the side" /></p>
</div>
<div class="text">
<h3 id="strategy">Strategy</h3>
<h1 id="strategy-and-tactics">Strategy and tactics</h1>
<p>&quot;Tactics without strategy is the noise before defeat.&quot;</p>
<p>&quot;Strategy without tactics is the slowest route to victory.&quot;</p>
<p>— attributed to Sun Tzu</p>
</div>
<footer>Photo: Martin Makaryan, Unsplash</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="82" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="sun-tzu">Sun Tzu</h3>
<h1 id="sun-tzus-five-factors">Sun Tzu’s five factors</h1>
<ul>
<li>Purpose — why we compete</li>
<li>Landscape — where we stand</li>
<li>Climate — what changes around us</li>
<li>Doctrine — training and standard ways of operating</li>
<li>Leadership — context-dependent strategic decisions</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="map inset" data-theme="galaxitech-black-grey-sand" lang="en-US" class="map inset" data-marpit-pagination="83" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:map inset;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="sun-tzu--the-five-factors-as-simon-wardley-draws-them-figure-1-cc-by-sa-40">Sun Tzu · the five factors as Simon Wardley draws them, figure 1, CC BY-SA 4.0</h3>
<p><img src="assets/wardley/five-factors-fig1.jpeg" alt="Simon Wardley's figure 1: the five factors as one ring, purpose, landscape, climate, doctrine and leadership, read clockwise from purpose" /></p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="84" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="john-boyd--the-ooda-loop">John Boyd · the OODA loop</h3>
<h1 id="john-boyds-ooda-loop-observe-orient-decide-act">John Boyd's OODA loop: observe, orient, decide, act</h1>
<ul>
<li>Observe: look at the landscape and at what is changing around it, the climate</li>
<li>Orient: make sense of it with the principles you trust, the doctrine</li>
<li>Decide: choose the move, which is leadership</li>
<li>Act: make the move, then observe again, because the landscape has changed</li>
<li>Boyd was a fighter pilot. The side that goes round the loop faster wins, even with less</li>
<li>Wardley puts the five factors on this loop. That is his strategy cycle, next slide</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>

<h3 id="doctrine--use-appropriate-methods-after-simon-wardley">Doctrine · use appropriate methods, after Simon Wardley</h3>
<h1 id="one-way-of-working-does-not-fit-the-whole-map">One way of working does not fit the whole map</h1>
<table>
<thead>
<tr>
<th></th>
<th>Genesis, custom built</th>
<th>Product</th>
<th>Commodity, utility</th>
</tr>
</thead>
<tbody>
<tr>
<td>The goal</td>
<td>Learn fast</td>
<td>Get it right</td>
<td>Cut cost and variation</td>
</tr>
<tr>
<td>How we work</td>
<td>Agile: small experiments</td>
<td>Lean: improve the flow</td>
<td>Six Sigma: standardise, automate</td>
</tr>
<tr>
<td>How we get it</td>
<td>Build it ourselves</td>
<td>Buy it and fit it in</td>
<td>Rent it as a utility</td>
</tr>
<tr>
<td>At Harbour Insurance</td>
<td>The product hypothesis</td>
<td>Event model tooling</td>
<td>AI coding agents, CI</td>
</tr>
</tbody>
</table>
<p>Simon Wardley's doctrine <mark>use appropriate methods</mark>: pick the way of working by the stage you placed it in during Exercise 3, not by habit.</p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>

<li>Why of movement: why this move over that one</li>
<li>Leaders often give the first why and skip the second</li>

</ul>

<h3 id="exercise-5--group-work">Exercise 5 · group work</h3>
<h1 id="exercise-5-simplify-and-move">Exercise 5: simplify and move</h1>
<ul>
<li><strong>First: Cut it down</strong>
<ul>
<li>Write the question your map answers</li>
<li>Remove what doesn't change the answer</li>
<li>Aim for 12 components or fewer</li>
</ul>
</li>
<li><strong>Then: Make a move</strong>
<ul>
<li>Draw one strategic move on your simplified map</li>
<li>Natural evolution (dashed) or intended move (solid arrow)</li>
<li>Pick a gameplay pattern that speeds it up or holds it back</li>
</ul>
</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="124" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="124" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="exercise-5--the-travelling-map">Exercise 5 · the travelling map</h3>
<h1 id="exercise-5-take-your-map-to-the-next-group">Exercise 5: take your map to the next group</h1>
<ul>
<li>Two of you visit another group, with your map</li>
<li>Go to the group with the next higher card</li>
<li>The group with the highest card goes to the lowest</li>
<li>Visitors: explain your question, your map and your move</li>
<li>Hosts: what did you leave out? Would you dare that move?</li>
<li>Then the hosts explain their map</li>
<li>About 10 minutes, then back to your own group</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="125" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="exercise" data-theme="galaxitech-black-grey-sand" lang="en-US" class="exercise" data-marpit-pagination="125" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:exercise;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">

<h3 id="a-real-map--the-same-story-in-this-weeks-research">A real map · the same story in this week's research</h3>
<h1 id="one-day-of-research-news-17-october-2026">One day of research news, 17 October 2026</h1>
<ul>
<li>Martin Rosén-Lidholm reads the agentic engineering papers every day and writes a digest</li>
<li>About today's batch he wrote: &quot;one of the strongest Software Civil Engineering signals we've seen. Multiple papers independently converge on the same thesis from different angles.&quot;</li>
<li>The thesis: code generation is cheap, so the work moves to formal workflows, verified approvals and clear specifications</li>
<li>That is the map you just drew. Next: his six pillars, then his five papers on one map</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="144" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="144" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="a-real-map--martin-ros%C3%A9n-lidholms-six-pillars-of-an-engineering-discipline-1-of-2">A real map · Martin Rosén-Lidholm's six pillars of an engineering discipline, 1 of 2</h3>
<h1 id="six-pillars-of-software-civil-engineering">Six pillars of Software Civil Engineering</h1>
<table>
<thead>
<tr>
<th>Pillar, from civil engineering</th>
<th>Software today</th>
<th>What Martin proposes</th>
</tr>
</thead>
<tbody>
<tr>
<td>Formal specification and verification</td>
<td>user stories, ad hoc documents</td>
<td>the event model as the specification, checked by evaluations</td>
</tr>
<tr>
<td>Standardised material datasheets</td>
<td>no performance profiles for frameworks or infrastructure</td>
<td>provider profiles: known latency, throughput, limits</td>
</tr>
<tr>
<td>Building codes and norms</td>
<td>fragments: OWASP, well-architected frameworks</td>
<td>a policy model of rules that must always hold</td>
</tr>
</tbody>
</table>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="145" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="145" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="a-real-map--martin-ros%C3%A9n-lidholms-six-pillars-of-an-engineering-discipline-2-of-2">A real map · Martin Rosén-Lidholm's six pillars of an engineering discipline, 2 of 2</h3>
<h1 id="six-pillars-of-software-civil-engineering-1">Six pillars of Software Civil Engineering</h1>
<table>
<thead>
<tr>
<th>Pillar, from civil engineering</th>
<th>Software today</th>
<th>What Martin proposes</th>
</tr>
</thead>
<tbody>
<tr>
<td>Simulation and modelling</td>
<td>almost none for application logic</td>
<td>run the behaviour as pure functions first</td>
</tr>
<tr>
<td>Professional licensure and liability</td>
<td>no personal accountability</td>
<td>an open gap, nothing proposed yet</td>
</tr>
<tr>
<td>Formal education and examination</td>
<td>varies, no proof of competence</td>
<td>specification as an examined skill</td>
</tr>
</tbody>
</table>
<p>Source: Martin Rosén-Lidholm, Software Civil Engineering: From Craft to Discipline, 22 March 2026, chronograph.rosenlidholm.se</p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>

<h3 id="extra-if-there-is-time--inertia-1">Extra, if there is time · inertia</h3>
<h1 id="what-resists-moving-right">What resists moving right</h1>
<ul>
<li>Good facilitation is a craft. It is hard to turn into a product</li>
<li>When something won't move, ask who would lose if it did</li>
<li>Turning a craft into a product can kill it, or let it scale</li>
<li>Help it evolve, or work around it</li>
</ul>

<li>Their needs sit just below, in their words</li>
<li>Everything else is there to meet a need</li>
<li>Ask &quot;how?&quot; to go down the chain, &quot;why?&quot; to go up</li>
<li>Several users? Where their needs differ, look closer</li>

<h3 id="appendix--submaps">Appendix · submaps</h3>
<h1 id="submaps-a-map-inside-a-component">Submaps: a map inside a component</h1>
<ul>
<li>A square around a component: it has its own map</li>
<li>Keep the top map to the decision at hand</li>
<li>Open a submap only for the part your question is about</li>
<li>Inside, the same rules: users, needs, evolution</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="188" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="188" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="appendix--constraint-and-inertia">Appendix · constraint and inertia</h3>
<h1 id="constraint-vs-inertia">Constraint vs inertia</h1>
<ul>
<li>Constraint: a capacity limit. Work piles up in front of it</li>
<li>Inertia: the old way is kept although a better one exists</li>
<li>Constraint sits on the component: the striped bar</li>
<li>Inertia sits on its evolution line: the solid bar</li>
<li>Ask who would lose if it moved: that is the inertia</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="189" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="189" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="appendix--theory-of-constraints--goldratt">Appendix · Theory of Constraints · Goldratt</h3>
<h1 id="goldratts-theory-of-constraints-five-steps">Goldratt’s Theory of Constraints: five steps</h1>
<ul>
<li>Identify the constraint</li>
<li>Exploit it: get the most out of what is there</li>
<li>Subordinate everything else to it</li>
<li>Elevate it: add capacity, <mark>only now</mark></li>
<li>Repeat: the constraint has moved</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="190" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="190" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="appendix--climate--after-simon-wardley">Appendix · climate · after Simon Wardley</h3>
<h1 id="wardleys-climate-patterns-you-cant-stop">Wardley’s climate: patterns you can't stop</h1>
<ul>
<li>Everything evolves through supply and demand competition</li>
<li>Characteristics change as components evolve</li>
<li>No choice over evolution</li>
<li>Practices co-evolve with the activities they support</li>
<li>Efficiency enables innovation</li>
<li>Higher-order systems create new sources of worth</li>
<li>Past success breeds inertia</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="191" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="191" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="appendix--doctrine--after-simon-wardley">Appendix · doctrine · after Simon Wardley</h3>
<h1 id="wardleys-doctrine-principles-that-work-anywhere">Wardley’s doctrine: principles that work anywhere</h1>
<ul>
<li>Focus on user needs</li>
<li>Know your users</li>
<li>Use a common language</li>
<li>Challenge assumptions</li>
<li>Remove duplication and bias</li>
<li>Use appropriate methods</li>
<li>Think small: small teams, small parts</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="192" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="192" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="appendix--gameplay--after-simon-wardley">Appendix · gameplay · after Simon Wardley</h3>
<h1 id="wardleys-gameplay-moves-you-can-choose">Wardley’s gameplay: moves you can choose</h1>
<ul>
<li>Open approaches: commoditise a layer someone else owns</li>
<li>ILC: innovate, leverage, commoditise</li>
<li>Standards game: set the rules others build on</li>
<li>Exploit inertia: move where a rival can't follow</li>
<li>Co-creation: build it with users, not for them</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="193" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-class="map" data-theme="galaxitech-black-grey-sand" lang="en-US" class="map" data-marpit-pagination="193" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--class:map;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="appendix--a-parallel-case--data-draft">Appendix · a parallel case — data (draft)</h3>
<p><img src="assets/diagrams/wardley-bad-data.svg" alt="Draft map of the data case: the business needs decisions it can trust, which need reports, which need shared data; shared data depends on cheap data pipelines and cloud storage on the right, and on a data model and data stewardship on the left; data stewardship carries the bottleneck bar; notes say pipelines and storage are cheap, and bad data comes from missing design and stewardship" /></p>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="194" data-paginate="true" data-footer="GalaxiTech · DDD Belgium workshop 2026" data-theme="galaxitech-black-grey-sand" lang="en-US" data-marpit-pagination="194" style="--paginate:true;--footer:GalaxiTech · DDD Belgium workshop 2026;--theme:galaxitech-black-grey-sand;" data-marpit-pagination-total="196">
<h3 id="reading--books-that-use-wardley-maps">Reading · books that use Wardley maps</h3>
<h1 id="if-you-want-to-read-on">If you want to read on</h1>
<p><img src="assets/books/wardley-maps-gunter.png" alt="Wardley Maps by Simon Wardley, the Leanpub edition" style="height:108px;" /> <img src="assets/books/architecture-for-flow.jpg" alt="Architecture for Flow by Susanne Kaiser" style="height:108px;" /> <img src="assets/books/architecture-modernization.jpg" alt="Architecture Modernization by Nick Tune" style="height:108px;" /> <img src="assets/books/value-flywheel-effect.jpg" alt="The Value Flywheel Effect by David Anderson, Mark McCann and Michael O’Reilly" style="height:108px;" /> <img src="assets/books/crafting-engineering-strategy.jpg" alt="Crafting Engineering Strategy by Will Larson" style="height:108px;" /> <img src="assets/books/flow-architectures.jpg" alt="Flow Architectures by James Urquhart" style="height:108px;" /> <img src="assets/books/the-art-of-strategy.jpg" alt="The Art of Strategy by Erik Schön" style="height:108px;" /> <img src="assets/books/crossing-the-chasm-with-wardley-maps.jpg" alt="Crossing the Chasm with Wardley Maps by Joaquín Peña Fernández" style="height:108px;" /> <img src="assets/books/draw-your-company-strategy.jpg" alt="Draw your company strategy by Joaquín Peña Fernández" style="height:108px;" /> <img src="assets/books/practical-introduction-to-wardley-mapping.png" alt="Practical Introduction to Wardley Mapping by E. Alex Hudson" style="height:108px;" /> <img src="assets/books/platform-strategy.png" alt="Platform Strategy by Gregor Hohpe" style="height:108px;" /></p>
<ul>
<li>First: Simon Wardley’s own book, free to read at medium.com/wardleymaps and on Leanpub</li>
<li>All the others map with Wardley maps. Kaiser and Tune write for a DDD audience</li>
<li>Erik Schön’s annex to The Art of Strategy collects 168 Wardley maps from 90 mappers, free to read. One of them is my logistics map</li>
</ul>
<footer>GalaxiTech · DDD Belgium workshop 2026</footer>
</section>
